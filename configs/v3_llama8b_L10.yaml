# Llama-3.1-8B-Instruct steered at decoder block 10 (2026-11-08 layer sweep: the preference direction's steering part
# there is +1.47 at 8 s.d., above all 8 random directions; at block 16, where runs 1-2 steered, nothing moves the choice).
# Directions refitted at block 10 on exp50's scores (scripts/rebuild_exp50.py --layer 10). Strengths are fractions of
# the mean residual norm at block 10 (~6.4); the readout's s.d. there is 0.53, so 0.33 ~ 4 s.d. and 0.66 ~ 8 s.d.
# Full sizes (as runs 1-2). Order: e2, e3, e5 on the jury data, then e4 LAST in chunks of 5 questions, each chunk
# covering every case kind and condition and saved on completion (a stopped run is a balanced sample; resume with
# run_swarm.py --out <run dir> --exp e4,e5), then e5 again on both.
run_name: v3_llama8b_L10
model: meta-llama/Llama-3.1-8B-Instruct
exp50_dir: data/exp50/Llama-3.1-8B-Instruct_L10
layer: 10
like_vector: general_readout
seed: 0
temperature: 1.0
max_new_tokens: 120
batch_choose: 16
batch_generate: 96
experiments: [e2, e3, e5, e4, e5]
null_directions: {cov: 30, iso: 10}
calibrate:
  n: 100
  fracs: [0.33, 0.66, 1.3]
e2:
  n_pairs: 240
  rounds: 3
  fracs: [0.33, 0.66]
  controls: [like, random, shuffled]
  n_chains: 160
  chain_len: 4
  chain_frac: 0.66
  chain_tokens: 80
e3:
  kinds: [passage, contested, planet_known, planet_blank, opinion]
  n_items: 60
  styles: [plain, confident, majority, stubborn]
  prefill: true
  frac: 0.66
  controls: [like, random]
  argument_tokens: 110
e4:
  kinds: [planet_known, planet_blank, contested, opinion]
  n_items: 60
  chunk_items: 5
  n_agents: 5
  rounds: 3
  minority: [1, 2]
  fracs: [0.33, 0.66]
  statement_tokens: 90
e5: {}
